[workspace]
resolver = "2"
members = ["crates/hearth-core", "crates/hearth-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
hearth-core = { path = "crates/hearth-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "2"
